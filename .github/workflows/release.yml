name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.26" }
      # Third-party actions in this secret-bearing job are pinned to immutable
      # commit SHAs (supply-chain hardening). Update the SHA + comment together.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with: { version: "~> v2", args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
